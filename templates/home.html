{% extends "index.html" %}

{% block Styles %}
<style>
/* =========================
   Page
   ========================= */
.home-container {
    max-width: 860px;
    margin: auto;
    padding: 3rem 1rem 6rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3.5rem;
}

/* =========================
   Hero
   ========================= */
.home-hero {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
    padding: 5rem 3rem 4.5rem;
    border-radius: 32px;
    overflow: hidden;
    width: 100%;
    text-align: center;
}

/* Animated radial background */
.home-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 90% 70% at 15% 25%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 55%),
        radial-gradient(ellipse 65% 55% at 85% 75%, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 5%,  color-mix(in srgb, var(--accent) 6%, transparent) 0%, transparent 45%);
    animation: heroPulse 12s ease-in-out infinite alternate;
    border-radius: inherit;
    z-index: 0;
}

.home-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--border));
    pointer-events: none;
    z-index: 0;
}

@keyframes heroPulse {
    0%   { transform: scale(1)    rotate(0deg);  opacity: 0.75; }
    50%  { transform: scale(1.04) rotate(1deg);  opacity: 1; }
    100% { transform: scale(1.08) rotate(-1deg); opacity: 0.85; }
}

.home-hero > * { position: relative; z-index: 1; }

/* Logo */
.home-logo {
    width: 140px;
    height: 140px;
    object-fit: contain;
    animation: logoEntry 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 12px 24px color-mix(in srgb, var(--accent) 25%, transparent));
}

@keyframes logoEntry {
    from { opacity: 0; transform: scale(0.4) rotate(-18deg) translateY(20px); }
    to   { opacity: 1; transform: scale(1) rotate(0deg) translateY(0); }
}

.home-logo:hover {
    transform: scale(1.07) rotate(-5deg);
    filter: drop-shadow(0 18px 32px color-mix(in srgb, var(--accent) 35%, transparent));
}

/* Title — characters animate in from below */
.home-title {
    font-size: clamp(2.8rem, 8vw, 5rem);
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.05em;
    line-height: 1;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    overflow: visible;
}

.title-char {
    display: inline-block;
    animation: charReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(var(--i) * 42ms + 0.45s);
}

@keyframes charReveal {
    from {
        opacity: 0;
        transform: translateY(55%) skewY(6deg);
        filter: blur(4px);
    }
    to {
        opacity: 1;
        transform: none;
        filter: blur(0);
    }
}

/* =========================
   Worlds Countdown
   ========================= */
.countdown-card {
    width: 100%;
    padding: 2rem 2.5rem;
    border-radius: 24px;
    background: var(--bg-elevated);
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent),
                0 16px 48px rgba(0,0,0,0.12);
    text-align: center;
    position: relative;
    overflow: hidden;
}

.countdown-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 70% 55% at 10% 20%, rgba(177,18,38,0.07) 0%, transparent 55%),
        radial-gradient(ellipse 55% 45% at 90% 80%, rgba(177,18,38,0.05) 0%, transparent 50%);
    pointer-events: none;
}

.countdown-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 1.1rem;
    position: relative;
}

.countdown-grid {
    display: flex;
    justify-content: center;
    gap: 1rem;
    position: relative;
    flex-wrap: wrap;
}

.countdown-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    min-width: 64px;
}

.countdown-value {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.countdown-value.tick {
    transform: scale(1.12);
}

.countdown-unit-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted-text);
}

.countdown-sep {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    align-self: flex-start;
    padding-top: 0.15rem;
    opacity: 0.5;
}

.countdown-event {
    margin-top: 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted-text);
    position: relative;
}

/* =========================
   CTA
   ========================= */
.home-cta a {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--accent);
    color: #fff;
    padding: 15px 42px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: background 0.22s ease, transform 0.18s ease, box-shadow 0.22s ease;
    box-shadow: 0 4px 24px rgba(177,18,38,0.4);
}

/* Light-sweep shimmer on hover */
.home-cta a::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg,
        transparent 35%,
        rgba(255,255,255,0.22) 50%,
        transparent 65%
    );
    transform: translateX(-100%);
    transition: transform 0.5s ease;
}

.home-cta a:hover::after  { transform: translateX(100%); }
.home-cta a:hover         { background: var(--accent-hover, #8f0f1f); transform: translateY(-3px); box-shadow: 0 10px 32px rgba(177,18,38,0.5); }
.home-cta a:active        { transform: scale(0.97); }

/* =========================
   Responsive
   ========================= */
@media (max-width: 640px) {
    .home-hero { padding: 3rem 1rem 2.5rem; }
    .home-logo { width: 80px; height: 80px; padding: 12px; border-radius: 20px; }
    .home-cta a { padding: 13px 32px; }
    .countdown-card { padding: 1.5rem 1rem; }
    .countdown-grid { gap: 0.5rem; }
    .countdown-sep { display: none; }
}
</style>
{% endblock %}

{% block Content %}
{% load static %}
<div class="home-container">

    <!-- HERO -->
    <div class="home-hero">
        <img src="{% static 'images/logo.png' %}" class="home-logo" alt="{{ app_name }} logo">
        <h1 class="home-title" id="hero-title">{{ app_name }}</h1>
    </div>

    <!-- WORLDS COUNTDOWN -->
    <div class="countdown-card reveal">
        <div class="countdown-label">Worlds Countdown</div>
        <div class="countdown-grid">
            <div class="countdown-unit">
                <span class="countdown-value" id="cd-days">--</span>
                <span class="countdown-unit-label">Days</span>
            </div>
            <div class="countdown-sep">:</div>
            <div class="countdown-unit">
                <span class="countdown-value" id="cd-hours">--</span>
                <span class="countdown-unit-label">Hours</span>
            </div>
            <div class="countdown-sep">:</div>
            <div class="countdown-unit">
                <span class="countdown-value" id="cd-mins">--</span>
                <span class="countdown-unit-label">Mins</span>
            </div>
            <div class="countdown-sep">:</div>
            <div class="countdown-unit">
                <span class="countdown-value" id="cd-secs">--</span>
                <span class="countdown-unit-label">Secs</span>
            </div>
        </div>
        <div class="countdown-event">FRC World Championship · Houston, TX · April 22, 2026</div>
    </div>

    <!-- CTA -->
    <div class="home-cta reveal">
        <a href="{% url 'teams' %}" data-i18n="home.view_teams">View Teams →</a>
    </div>

</div>
{% endblock %}

{% block Scripts %}
<script>
(function () {
    /* Split-char title animation */
    var titleEl = document.getElementById('hero-title');
    if (titleEl) {
        var text = titleEl.textContent.trim();
        titleEl.innerHTML = Array.from(text).map(function (ch, i) {
            return '<span class="title-char" style="--i:' + i + '">'
                + (ch === ' ' ? '&nbsp;' : ch) + '</span>';
        }).join('');
    }

    /* Worlds Countdown */
    var WORLDS_DATE = new Date('2026-04-22T08:00:00-05:00'); // Houston CDT
    var elD = document.getElementById('cd-days');
    var elH = document.getElementById('cd-hours');
    var elM = document.getElementById('cd-mins');
    var elS = document.getElementById('cd-secs');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick(el, val) {
        var str = pad(val);
        if (el.textContent !== str) {
            el.textContent = str;
            el.classList.remove('tick');
            void el.offsetWidth; /* reflow */
            el.classList.add('tick');
            setTimeout(function () { el.classList.remove('tick'); }, 220);
        }
    }

    function update() {
        var now  = new Date();
        var diff = WORLDS_DATE - now;
        if (diff <= 0) {
            elD.textContent = elH.textContent = elM.textContent = elS.textContent = '00';
            return;
        }
        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff % 86400000) / 3600000);
        var m = Math.floor((diff % 3600000)  / 60000);
        var s = Math.floor((diff % 60000)    / 1000);
        tick(elD, d);
        tick(elH, h);
        tick(elM, m);
        tick(elS, s);
    }

    update();
    setInterval(update, 1000);
})();
</script>
{% endblock %}
