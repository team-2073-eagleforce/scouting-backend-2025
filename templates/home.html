{% extends "index.html" %}

{% block Styles %}
<style>
/* =========================
   Page Layout
   ========================= */
.home-container {
    max-width: 1100px;
    margin: auto;
    padding: 3rem 1rem;
    text-align: center;
}

/* =========================
   Hero Section
   ========================= */
.home-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    margin-bottom: 3rem;
}

.home-logo {
    width: 180px;
    height: auto;

    /* Always-white background frame */
    background: #ffffff;
    padding: 16px;

    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);

    transition: transform 0.3s ease;
}


.home-logo:hover {
    transform: scale(1.05);
}

.home-title {
    font-size: 3rem;
    font-weight: 800;
    color: var(--accent);
}

.home-subtitle {
    font-size: 1.4rem;
    color: var(--muted-text);
    max-width: 700px;
}

/* =========================
   Countdown Section
   ========================= */
.countdown-section {
    margin: 3rem 0;
}

.countdown-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--text);
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
}

.countdown span {
    background: var(--bg-elevated);
    color: var(--accent);
    padding: 18px 22px;
    border-radius: 14px;
    min-width: 90px;
    font-size: 1.8rem;
    font-weight: 700;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}

/* =========================
   Feature Cards
   ========================= */
.features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
    margin-top: 3rem;
}

.feature-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
    text-align: left;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.feature-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.15);
}

.feature-card h3 {
    margin-bottom: 0.5rem;
    color: var(--accent);
}

.feature-card p {
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.5;
}

/* =========================
   Call to Action
   ========================= */
.home-cta {
    margin-top: 4rem;
}

.home-cta p {
    font-size: 1.1rem;
    color: var(--muted-text);
    margin-bottom: 1rem;
}

.home-cta a {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 12px 28px;
    border-radius: 10px;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.1s ease;
}

.home-cta a:hover {
    background: var(--accent-hover, var(--accent));
}

.home-cta a:active {
    transform: scale(0.97);
}

/* =========================
   Responsive
   ========================= */
@media (max-width: 768px) {
    .home-title {
        font-size: 2.4rem;
    }

    .countdown span {
        font-size: 1.5rem;
        min-width: 75px;
    }
}
</style>
{% endblock %}

{% block Content %}
<div class="home-container">

    <!-- HERO -->
    <div class="home-hero">
        {% load static %}
        <h1 class="home-title">{{ app_name }}</h1>
        <img src="{% static 'images/logo.png' %}" class="home-logo">
        </p>
    </div>

    <!-- COUNTDOWN -->
    <div class="countdown-section">
        <div class="countdown-title">Worlds Is In:</div>
        <div class="countdown" id="result">
            <span id="days">0d</span>
            <span id="hours">0h</span>
            <span id="mins">0m</span>
            <span id="secs">0s</span>
        </div>
    </div>




    <!-- CTA -->
    <div class="home-cta">
        <p>Ready to start scouting?</p>
        <a href="{% url 'teams' %}">Go to Teams</a>
    </div>

</div>
{% endblock %}

{% block Scripts %}
<script>
    const countDownDate = new Date("April 29, 2026 12:00:00").getTime();

    const countdownSection = document.querySelector(".countdown-section");
    const countdownTitle = document.querySelector(".countdown-title");
    const countdownResult = document.getElementById("result");

    const myfunc = setInterval(function () {
        const now = new Date().getTime();
        const timeleft = countDownDate - now;

        if (timeleft <= 0) {
            clearInterval(myfunc);

            // Remove timer
            countdownResult.remove();

            // Update text
            countdownTitle.textContent = "Get ready for offseason!";

            return;
        }

        const days = Math.floor(timeleft / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeleft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeleft % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeleft % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = days + "d";
        document.getElementById("hours").textContent = hours + "h";
        document.getElementById("mins").textContent = minutes + "m";
        document.getElementById("secs").textContent = seconds + "s";
    }, 1000);
</script>
{% endblock %}
