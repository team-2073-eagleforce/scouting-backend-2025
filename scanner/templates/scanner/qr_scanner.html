{% extends 'index.html' %}
{% load static %}

{% block Title %}Scanner{% endblock %}

{% block Styles %}
<style>
/* =========================
   Layout
   ========================= */
.scanner-page {
    max-width: 960px;
    margin: auto;
    padding-top: 1rem;
    display: grid;
    /* minmax(0,1fr) prevents long text in the card from stretching the column */
    grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-rows: auto 1fr;
    gap: 1rem;
}

.scanner-page-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.scanner-page-header h2 {
    margin: 0;
    font-weight: 800;
    font-size: 1.5rem;
}

/* =========================
   Scanner Card (left)
   ========================= */
.scanner-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1rem;
    box-shadow: 0 6px 18px rgba(0,0,0,0.07);
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
}

html.inverted .scanner-card {
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
}

/* =========================
   Video
   ========================= */
#video-container {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4 / 3;
    /* Do NOT use flex here — absolute-positioned child is used instead
       so the library's inline width/height on the video cannot affect layout */
}

#qr-video {
    /* Absolute fill: library inline-style changes to width/height
       affect the element's own size but the CONTAINER's size stays
       fixed by aspect-ratio, so the page never reflows/zooms */
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
    border-radius: inherit;
    display: block;
    transform: none !important;
}

/* Canvas overlay for the yellow QR code outline */
#qr-outline-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* =========================
   Feedback bar
   ========================= */
.feedback-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0.85rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 44px;
}

.feedback-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted-text);
    white-space: nowrap;
}

#cam-qr-result {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    word-break: break-all;
    flex: 1;
    min-width: 0; /* required: prevents flex item from expanding past container */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.2s;
}

#cam-qr-result.flash {
    color: var(--accent);
    animation: resultFlash 0.45s ease;
}

@keyframes resultFlash {
    0%   { opacity: 1; }
    25%  { opacity: 0.4; }
    100% { opacity: 1; }
}

.scan-feedback-text {
    font-size: 0.8rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    transition: background 0.2s ease, color 0.2s ease;
    white-space: nowrap;
}

.feedback-sending { background: color-mix(in srgb, #f59e0b 15%, var(--bg)); color: #f59e0b; }
.feedback-success { background: rgba(34,197,94,0.12); color: #16a34a; }
.feedback-error   { background: rgba(239,68,68,0.12);  color: #ef4444; }
.feedback-idle    { background: var(--border); color: var(--muted-text); }

html.inverted .feedback-success { color: #4ade80; }

/* =========================
   Controls row
   ========================= */
.scanner-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.camera-row {
    flex: 1;
    min-width: 140px;
}

#camera-select {
    width: 100%;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.2s;
}

#camera-select:focus { border-color: var(--accent); }

#start-button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    padding: 8px 18px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    font-size: 0.875rem;
}

#start-button:hover   { background: var(--accent-hover, #8f0f1f); }
#start-button:active  { transform: scale(0.96); }

#stop-button {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-weight: 700;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.1s;
    font-size: 0.875rem;
}

#stop-button:hover  { background: color-mix(in srgb, var(--accent) 10%, var(--bg-elevated)); }
#stop-button:active { transform: scale(0.96); }

/* =========================
   Scan History (right panel)
   ========================= */
.history-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.07);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

html.inverted .history-card {
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
}

.history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
}

.history-title {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted-text);
}

.history-count {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
    color: var(--accent);
}

#scan-history-list {
    flex: 1;
    overflow-y: auto;
    max-height: 480px;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

#scan-history-list::-webkit-scrollbar { width: 5px; }
#scan-history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

#scan-history-empty {
    padding: 2rem 1rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted-text);
}

.history-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 0.82rem;
    line-height: 1.3;
}

.history-row.history-success { border-left: 3px solid #22c55e; }
.history-row.history-error   { border-left: 3px solid #ef4444; }

.h-icon {
    font-size: 0.8rem;
    font-weight: 800;
    flex-shrink: 0;
    width: 16px;
    text-align: center;
}

.history-success .h-icon { color: #16a34a; }
.history-error   .h-icon { color: #ef4444; }
html.inverted .history-success .h-icon { color: #4ade80; }

.h-body {
    flex: 1;
    color: var(--text);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.h-scouter { font-weight: 700; }
.h-scouter.muted { color: var(--muted-text); font-weight: 500; }

.h-time {
    font-size: 0.7rem;
    color: var(--muted-text);
    white-space: nowrap;
    flex-shrink: 0;
}

/* =========================
   Responsive
   ========================= */
@media (max-width: 900px) {
    .scanner-page {
        grid-template-columns: 1fr;
    }

    #video-container {
        aspect-ratio: 1 / 1;
    }

    .history-card {
        max-height: 260px;
    }

    #scan-history-list {
        max-height: 200px;
    }
}
</style>
{% endblock %}

{% block Content %}
{% csrf_token %}
<div class="scanner-page">

    <!-- Header -->
    <div class="scanner-page-header">
        <h2>QR Scanner</h2>
    </div>

    <!-- Camera + feedback -->
    <div class="scanner-card">

        <div id="video-container">
            <video id="qr-video" playsinline></video>
            <canvas id="qr-outline-canvas"></canvas>
        </div>

        <!-- Feedback bar -->
        <div class="feedback-bar">
            <span class="feedback-label">Last scan</span>
            <span id="cam-qr-result">—</span>
            <span id="scan-feedback" class="scan-feedback-text feedback-idle">Ready</span>
        </div>

        <!-- Controls -->
        <div class="scanner-controls">
            <div class="camera-row">
                <select id="camera-select"></select>
            </div>
            <button id="start-button">▶ Start</button>
            <button id="stop-button">■ Stop</button>
        </div>

    </div>

    <!-- Scan history -->
    <div class="history-card">
        <div class="history-header">
            <span class="history-title">Scan History</span>
            <span class="history-count" id="history-count">0</span>
        </div>
        <div id="scan-history-list">
            <div id="scan-history-empty">No scans yet</div>
        </div>
    </div>

</div>
{% endblock %}

{% block Scripts %}
<script type="module" src="{% static 'scanner/scanner.js' %}"></script>
<script>
/* Update history count badge */
(function () {
    var histList  = document.getElementById('scan-history-list');
    var countBadge = document.getElementById('history-count');
    if (!histList || !countBadge) return;
    new MutationObserver(function () {
        var rows = histList.querySelectorAll('.history-row');
        countBadge.textContent = rows.length;
    }).observe(histList, { childList: true });
})();
</script>
{% endblock %}
