{% extends 'index.html' %}

{% block Title %}Login{% endblock %}

{% block Content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>Login to Scouting System</h3>
                </div>
                <div class="card-body">
                    <p>Please sign in with your authorized Google account.</p>
                    <a href="?login=true" class="btn btn-primary btn-lg btn-block">
                        Sign in with Google
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
